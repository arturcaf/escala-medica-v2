name: Restaurar Versao Original Completa

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Restaurar JAR original com todos os dados
        run: |
          curl -L -o escala-medica.jar https://github.com/arturcaf/escala-medica/raw/master/escala-medica.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add escala-medica.jar
          git commit -m "Restaura escala-medica.jar original com todos os dados [skip ci]" || echo "Sem alteracoes"
          git push
